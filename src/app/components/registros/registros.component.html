<header>
    <div id="header-logo">
        <h2>Meu Diário</h2>
        <h2>SENAC</h2>
    </div>
    <div id="header-titulo">
        <p>Registre seus pensamentos</p>
        <p>e anotações</p>
    </div>
    <div id="header-avatar">
        <button id="avatar-clicavel"></button>
        <div id="avatar-nome-menu">
            <h3>Nome do Usuário</h3>
            <a href="javascript:void(0)">✏️Editar perfil</a>
        </div>
    </div>
</header>
<main>
    <h2 id="titulo-registros">Registros</h2>
    <div id="registros-container" *ngFor="let registroOrigem of registrosOrigem">
        <app-card-registro [registroDestino]="registroOrigem"></app-card-registro>
    </div>
    <button id="adicionar-registro" (click)="modalSolicitado = true">
        <span>+</span>
    </button>
</main>
<footer>
    <div id="extras">
        <p>Umas parada</p>
        <p>e talz</p>
    </div>
    <div id="extras 2">
        <p>Algumas outras</p>
        <p>paradas e talz</p>
    </div>
    <div id="extras 3">
        <p>As últimas paradas</p>
        <p>e talz</p>
    </div>
</footer>

@if (modalSolicitado) {
    <div id="modal-container">
        <section id="modal">
            <div id="modal-header">
                <h2>Adicionar Registro</h2>
                <button id="modal-fechar" (click)="modalSolicitado = false">X</button>
            </div>
            <form id="modal-form" (ngSubmit)="adicionarRegistro()">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Digite o título do registro" required [(ngModel)]="novoRegistro.titulo">

                <label for ="conteudo">Conteúdo:</label>
                <textarea id="conteudo" name="conteudo" placeholder="Digite o conteúdo do registro" required [(ngModel)]="novoRegistro.conteudo"></textarea>

                <button type="submit">Salvar</button>
            </form>
        </section>
    </div>
}
